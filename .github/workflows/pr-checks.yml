name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --workspace=@hh/web --workspace=@hh/core --workspace=@hh/fhir --workspace=@hh/billing --workspace=@hh/whatsapp --include-workspace-root

      - name: Typecheck — apps/web
        run: npm run typecheck --workspace=@hh/web

      - name: Typecheck — hh-core
        run: npm run typecheck --workspace=@hh/core

      - name: Typecheck — hh-fhir
        run: npm run typecheck --workspace=@hh/fhir

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --workspace=@hh/web --include-workspace-root

      - name: Lint — apps/web
        run: npm run lint --workspace=@hh/web

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --workspace=@hh/web --workspace=@hh/billing --include-workspace-root

      - name: Install Playwright browsers
        run: npm exec --workspace=@hh/web -- playwright install chromium --with-deps

      - name: Build app
        run: npm run build --workspace=@hh/web
        env:
          AUTH_SECRET: test-e2e-auth-secret-minimum-32ch
          NEXTAUTH_URL: http://localhost:3000
          MEDPLUM_BASE_URL: http://localhost:8103/
          MEDPLUM_CLIENT_ID: test
          MEDPLUM_CLIENT_SECRET: test
          MEDPLUM_PROJECT_ID: test

      - name: Run E2E tests
        run: npm run test:e2e --workspace=@hh/web
        env:
          CI: true
          AUTH_SECRET: test-e2e-auth-secret-minimum-32ch
          NEXTAUTH_URL: http://localhost:3000
          MEDPLUM_BASE_URL: http://localhost:8103/
          MEDPLUM_CLIENT_ID: test
          MEDPLUM_CLIENT_SECRET: test
          MEDPLUM_PROJECT_ID: test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
